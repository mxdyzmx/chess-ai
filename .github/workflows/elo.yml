name: Elo Estimate

on:
  workflow_dispatch:  # manual trigger
  push:
    branches: [ main ]

jobs:
  estimate-elo:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # prevent hanging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish

      - name: Build ChessAI
        run: |
          make clean 2>/dev/null || true
          make CXXFLAGS="-O3 -march=native -pthread -std=c++17 -Wall -Wextra -Wno-sign-compare -Wno-unused-parameter" LDFLAGS="-pthread" -j$(nproc) 2>&1

      - name: Verify Stockfish
        run: echo "quit" | stockfish | head -1

      - name: Run Elo estimate
        id: elo
        run: |
          python3 scripts/match.py --games 20 --movetime 20 --depth 2 2>&1 | tee elo_result.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: elo-results
          path: elo_result.txt
