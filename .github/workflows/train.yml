name: Self-Training

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of training games'
        required: true
        default: '30'
        type: string
      sf_depth:
        description: 'Stockfish search depth'
        required: true
        default: '6'
        type: string
      epochs:
        description: 'Training epochs'
        required: true
        default: '200'
        type: string
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # prevent hanging
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish python3-numpy

      - name: Build engine (baseline)
        run: |
          make clean 2>/dev/null || true
          make -j$(nproc)

      - name: Run training
        id: train
        run: |
          GAMES="${{ inputs.games || '30' }}"
          SF_DEPTH="${{ inputs.sf_depth || '6' }}"
          EPOCHS="${{ inputs.epochs || '200' }}"
          echo "Training: games=${GAMES}, sf_depth=${SF_DEPTH}, epochs=${EPOCHS}"
          python3 scripts/train.py \
            --games "${GAMES}" \
            --sf-depth "${SF_DEPTH}" \
            --epochs "${EPOCHS}" \
            --lr 0.001 \
            --no-pr 2>&1 | tee training_log.txt

      - name: Check for weight changes
        id: diff
        run: |
          if git diff --quiet src/default_weights.inc; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Weights unchanged — no improvement found."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Weights changed — creating PR."
            echo "diff_stats=$(git diff --stat src/default_weights.inc)" >> $GITHUB_OUTPUT
          fi

      - name: Extract metrics from training log
        id: metrics
        if: steps.diff.outputs.changed == 'true'
        run: |
          VAL_CORR=$(grep "Validation correlation" training_log.txt | tail -1 | awk '{print $NF}')
          VAL_MAE=$(grep "Validation MAE" training_log.txt | tail -1 | awk '{print $NF}')
          TOTAL_POS=$(grep "Total:" training_log.txt | tail -1 | awk '{print $2}')
          echo "correlation=${VAL_CORR:-N/A}" >> $GITHUB_OUTPUT
          echo "mae=${VAL_MAE:-N/A}" >> $GITHUB_OUTPUT
          echo "positions=${TOTAL_POS:-N/A}" >> $GITHUB_OUTPUT

      - name: Build and benchmark new engine
        id: bench_new
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "=== New engine ==="
          ./chessai --bench 2>&1 | tee bench_new.txt
          DEPTH=$(grep "Depth:" bench_new.txt | awk '{print $2}')
          NPS=$(grep "NPS:" bench_new.txt | awk '{print $2}')
          echo "depth=${DEPTH}" >> $GITHUB_OUTPUT
          echo "nps=${NPS}" >> $GITHUB_OUTPUT

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            auto: update eval weights via self-training

            Training config: ${{ inputs.games || '30' }} games vs Stockfish depth ${{ inputs.sf_depth || '6' }}

            Validation:
            - Positions collected: ${{ steps.metrics.outputs.positions }}
            - Correlation with Stockfish eval: ${{ steps.metrics.outputs.correlation }}
            - Mean absolute error: ${{ steps.metrics.outputs.mae }} cp
            - Benchmark depth: ${{ steps.bench_new.outputs.depth }}
            - NPS: ${{ steps.bench_new.outputs.nps }}
          branch: auto-training/weight-update
          base: main
          title: 'auto: update evaluation weights via self-training'
          body: |
            ## 🤖 Self-Training Weight Update

            This PR was automatically generated by the self-training pipeline.

            ### Training Config
            - Games played: ${{ inputs.games || '30' }} vs Stockfish
            - Stockfish depth: ${{ inputs.sf_depth || '6' }}
            - Training epochs: ${{ inputs.epochs || '200' }}

            ### Validation Results
            | Metric | Value |
            |--------|-------|
            | Positions collected | ${{ steps.metrics.outputs.positions }} |
            | Correlation with Stockfish | ${{ steps.metrics.outputs.correlation }} |
            | Mean absolute error | ${{ steps.metrics.outputs.mae }} cp |
            | Benchmark depth | ${{ steps.bench_new.outputs.depth }} |
            | NPS | ${{ steps.bench_new.outputs.nps }} |

            ### Files Changed
            - `src/default_weights.inc`: Updated evaluation weights

            ---
            *Generated by ChessAI Self-Training workflow*
          labels: |
            auto-training
            enhancement
          add-paths: |
            src/default_weights.inc

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: |
            training_log.txt
            bench_new.txt
            src/default_weights.inc
